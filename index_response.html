<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillScan | Resume Screening</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>SkillScan</h1>
        <p class="subtitle">Smart Resume Screening Engine</p>

        <form id="resumeForm" enctype="multipart/form-data" novalidate>
            <label for="resumeInput">Upload Resume (PDF / DOC / DOCX)</label>
            <input id="resumeInput" type="file" name="resume" accept=".pdf,application/pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>

            <label for="jobInput">Job Required Skills</label>
            <textarea id="jobInput" name="job" required></textarea>

            <div id="formError" role="alert" style="color:#b00020; margin:8px 0; display:none;"></div>

            <button id="uploadBtn" type="button" onclick="uploadResume()">Upload &amp; Screen</button>
        </form>
    </div>
</div>

<script>
    // Configuration
    const MAX_FILE_BYTES = 10 * 1024 * 1024; // 10 MB
    const ALLOWED_EXT = ['.pdf', '.doc', '.docx'];

    function showError(message) {
        const el = document.getElementById('formError');
        el.textContent = message || '';
        el.style.display = message ? 'block' : 'none';
    }

    function validateForm() {
        showError('');
        const fileInput = document.getElementById('resumeInput');
        const jobInput = document.getElementById('jobInput');

        if (!fileInput.files || fileInput.files.length === 0) {
            showError('Please select a resume file.');
            return false;
        }

        const file = fileInput.files[0];
        const name = (file.name || '').toLowerCase();
        const hasAllowedExt = ALLOWED_EXT.some(ext => name.endsWith(ext));
        if (!hasAllowedExt) {
            showError('Unsupported file type. Use PDF, DOC or DOCX.');
            return false;
        }

        if (file.size > MAX_FILE_BYTES) {
            showError('File is too large. Maximum allowed is 10 MB.');
            return false;
        }

        if (!jobInput.value || !jobInput.value.trim()) {
            showError('Please enter required job skills.');
            return false;
        }

        return true;
    }

    async function uploadResume() {
        if (!validateForm()) return;

        const btn = document.getElementById('uploadBtn');
        const form = document.getElementById('resumeForm');
        const formData = new FormData(form);

        // UI: disable while uploading
        btn.disabled = true;
        const prevText = btn.textContent;
        btn.textContent = 'Uploading...';

        try {
            const res = await fetch('/api/resume/upload', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                // try to extract error message from JSON or text
                let msg = `Upload failed: ${res.status} ${res.statusText}`;
                try {
                    const errJson = await res.json();
                    if (errJson && errJson.message) msg = errJson.message;
                } catch (_) {
                    try {
                        const txt = await res.text();
                        if (txt) msg = txt;
                    } catch (__) {
                        // ignore
                    }
                }
                showError(msg);
                return;
            }

            let data;
            try {
                data = await res.json();
            } catch (e) {
                showError('Server returned invalid JSON.');
                return;
            }

            // store and redirect to result page
            sessionStorage.setItem('screeningResult', JSON.stringify(data));
            window.location.href = '/result';
        } catch (err) {
            showError('Upload failed. Check your network connection and try again.');
            console.error('Upload error', err);
        } finally {
            btn.disabled = false;
            btn.textContent = prevText;
        }
    }
</script>

</body>
</html>
