<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillScan | Resume Screening</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="left-panel">
    <div class="brand">SkillScan</div>
    <h1>Smart Resume Screening</h1>
    <p>Upload resumes and get instant match scores based on job skills.</p>
</div>

<div class="right-panel">
    <div class="card">
        <h2>Upload Resume</h2>

        <form id="resumeForm">
            <div class="form-group">
                <input type="file" name="resume" required>
            </div>

            <div class="form-group">
                <textarea name="jobDescription" rows="4"
                          placeholder="Required skills: Java, Spring Boot, PostgreSQL"
                          required></textarea>
            </div>

            <button type="submit">Upload & Screen</button>
        </form>

        <div class="result" id="resultBox"></div>
    </div>
</div>

<script src="/main.js"></script>
</body>
</html>
