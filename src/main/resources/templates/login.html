<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillScan | Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="left-panel">
    <div class="brand">SkillScan</div>
    <h1>Let AI make your career <span class="highlight">10x successful</span></h1>
    <p>AI-powered resume screening to shortlist candidates faster and smarter.</p>
</div>

<div class="right-panel">
    <div class="card">
        <h2>Welcome back</h2>

        <form action="/login" method="post">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Sign In</button>
        </form>
    </div>
</div>

</body>
</html>
